name: Release

on:
  push:
    tags:
      - "*"

permissions:
  attestations: write
  contents: write
  id-token: write
  artifact-metadata: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and check
        run: npm run check

      - name: Validate release tag
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          node -e "const version = require('./manifest.json').version; const versions = require('./versions.json'); if (!versions[version]) { console.error('versions.json is missing ' + version); process.exit(1); }"

          if [ "${tag_version}" != "${manifest_version}" ]; then
            echo "Release tag must exactly match manifest.json version."
            echo "Tag: ${tag_version}"
            echo "manifest.json: ${manifest_version}"
            exit 1
          fi

          if [ "${manifest_version}" != "${package_version}" ]; then
            echo "manifest.json version and package.json version must match."
            echo "manifest.json: ${manifest_version}"
            echo "package.json: ${package_version}"
            exit 1
          fi

          echo "version=${manifest_version}" >> "${GITHUB_OUTPUT}"

      - name: Check existing release
        id: existing-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Release ${VERSION} already exists. Skipping publish."
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Attest release assets
        if: steps.existing-release.outputs.exists == 'false'
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json

      - name: Create GitHub release
        if: steps.existing-release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          assets=(dist/manifest.json dist/main.js)

          if [ -f dist/styles.css ]; then
            assets+=(dist/styles.css)
          fi

          gh release create "${VERSION}" "${assets[@]}" \
            --title "${VERSION}" \
            --generate-notes
